<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大ナゴヤ大学 教室マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f7f7f5; --panel:#fff; --line:#e3e3de; --text:#26251f;
    --muted:#77756c; --accent:#c2410c; --accent2:#0f766e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
       color:var(--text);background:var(--bg);overflow:hidden}
  header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:var(--muted)}
  #wrap{display:flex;height:calc(100% - 45px)}
  #side{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column}
  #controls{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  #q{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--line);border-radius:6px;
     font-family:inherit;background:#fbfbf9}
  #q:focus{outline:2px solid var(--accent2);outline-offset:-1px}
  .row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .row label{display:flex;align-items:center;gap:5px;cursor:pointer}
  #count{margin-left:auto;font-variant-numeric:tabular-nums}
  #list{flex:1;overflow-y:auto}
  .item{padding:9px 12px;border-bottom:1px solid #f0f0ec;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
  .item:hover{background:#fdf7f2}
  .item.active{background:#fdece1}
  .badge{flex:0 0 auto;min-width:22px;height:22px;border-radius:11px;background:var(--accent);
         color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
         padding:0 6px;margin-top:1px}
  .badge.one{background:#b8b6ac}
  .nm{font-size:13px;line-height:1.35}
  .ad{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
  #map{flex:1}
  .leaflet-popup-content{margin:10px 12px;font-size:12.5px;line-height:1.5;max-width:280px}
  .pop-t{font-weight:700;font-size:13.5px;margin-bottom:4px}
  .pop-k{color:var(--muted);font-size:11px}
  .pop-r{margin-top:5px}
  .pop-links a{display:inline-block;margin:2px 5px 0 0;font-size:11px;color:var(--accent2)}
  .approx{display:inline-block;font-size:10px;background:#fef3c7;color:#92400e;
          padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
  .marker-lab{background:var(--accent);color:#fff;border-radius:50%;text-align:center;
              font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .marker-lab.one{background:#8b8880}
  #note{padding:8px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);line-height:1.5}
  @media (max-width:800px){
    #wrap{flex-direction:column}
    #side{width:100%;min-width:0;height:44%;border-right:none;border-bottom:1px solid var(--line)}
    #map{height:56%}
  }
</style>
</head>
<body>
<header>
  <h1>大ナゴヤ大学 教室マップ</h1>
  <span class="sub">授業詳細ページ108件・教室60箇所（2026-07-29 時点）</span>
</header>
<div id="wrap">
  <div id="side">
    <div id="controls">
      <input id="q" type="search" placeholder="教室名・住所で検索（例：名古屋城、岐阜、銭湯）">
      <div class="row">
        <label><input type="checkbox" id="onlyMulti"> 使用回数1回の教室を隠す</label>
        <span id="count"></span>
      </div>
    </div>
    <div id="list"></div>
    <div id="note">
      ピン内の数字は、その教室で開催された授業の件数です。<br>
      <span class="approx">概略</span> は住所が「◯◯界隈」などエリア名のみ、または番地まで特定できなかったため、町名・最寄駅レベルで表示している教室です。
    </div>
  </div>
  <div id="map"></div>
</div>

/* ---------- 重なるピンを微妙にずらす ---------- */
(function(){
  const seen = {};
  VENUES.forEach(v=>{
    const k = v.lat.toFixed(5)+','+v.lon.toFixed(5);
    if(seen[k]!==undefined){
      const i = ++seen[k];
      const ang = i * 2.399963;            // 黄金角
      const r = 0.00095 + i*0.00035;
      v.lat += r*Math.cos(ang);
      v.lon += r*Math.sin(ang)*1.22;
      v.jit = true;
    } else { seen[k]=0; }
  });
})();

const map = L.map('map',{zoomControl:true}).setView([35.17,136.92],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function popupHtml(v){
  const c = v.ids.length;
  let h = '<div class="pop-t">'+esc(v.n)+(v.ap?'<span class="approx">概略</span>':'')+'</div>';
  h += '<div class="pop-k">開催実績 '+c+'件</div>';
  if(v.ad) h += '<div class="pop-r"><span class="pop-k">住所</span><br>'+esc(v.ad)+'</div>';
  if(v.ac) h += '<div class="pop-r"><span class="pop-k">アクセス</span><br>'+esc(v.ac)+'</div>';
  if(v.pk) h += '<div class="pop-r"><span class="pop-k">駐車場</span><br>'+esc(v.pk)+'</div>';
  h += '<div class="pop-r pop-links"><span class="pop-k">授業ページ</span><br>'+
       v.ids.map(id=>'<a href="https://dai-nagoya.univnet.jp/subjects/detail/'+id+'" target="_blank" rel="noopener">#'+id+'</a>').join('')+'</div>';
  h += '<div class="pop-r pop-links">'+
       (v.gm?'<a href="'+esc(v.gm)+'" target="_blank" rel="noopener">サイト掲載の地図 ↗</a>':'')+
       '<a href="https://www.google.com/maps/search/?api=1&query='+v.lat+','+v.lon+'" target="_blank" rel="noopener">Googleマップで開く ↗</a></div>';
  return h;
}

VENUES.forEach((v,i)=>{
  const c = v.ids.length;
  const size = Math.min(46, 24 + c*1.3);
  v.marker = L.marker([v.lat,v.lon],{
    icon: L.divIcon({
      className:'',
      html:'<div class="marker-lab'+(c===1?' one':'')+'" style="width:'+size+'px;height:'+size+'px;line-height:'+(size-4)+'px">'+c+'</div>',
      iconSize:[size,size], iconAnchor:[size/2,size/2], popupAnchor:[0,-size/2]
    })
  }).bindPopup(popupHtml(v),{maxWidth:300});
  v.marker.on('click',()=>select(i,false));
  v.idx = i;
});

const layer = L.layerGroup(VENUES.map(v=>v.marker)).addTo(map);

/* ---------- サイドリスト ---------- */
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const multiEl = document.getElementById('onlyMulti');
const countEl = document.getElementById('count');
let current = -1;

const order = VENUES.map((v,i)=>i).sort((a,b)=>
  VENUES[b].ids.length - VENUES[a].ids.length || VENUES[a].n.localeCompare(VENUES[b].n,'ja'));

function render(){
  const q = qEl.value.trim().toLowerCase();
  const onlyMulti = multiEl.checked;
  let shown = 0;
  listEl.innerHTML = '';
  layer.clearLayers();
  const bounds = [];
  order.forEach(i=>{
    const v = VENUES[i], c = v.ids.length;
    const hay = (v.n+' '+v.ad+' '+v.ac).toLowerCase();
    if(q && hay.indexOf(q) === -1) return;
    if(onlyMulti && c === 1) return;
    shown++;
    layer.addLayer(v.marker);
    bounds.push([v.lat,v.lon]);
    const d = document.createElement('div');
    d.className = 'item' + (i===current?' active':'');
    d.innerHTML = '<div class="badge'+(c===1?' one':'')+'">'+c+'</div>'+
      '<div><div class="nm">'+esc(v.n)+(v.ap?'<span class="approx">概略</span>':'')+'</div>'+
      '<div class="ad">'+esc(v.ad || '（住所の記載なし）')+'</div></div>';
    d.onclick = ()=>select(i,true);
    listEl.appendChild(d);
  });
  countEl.textContent = shown + ' / ' + VENUES.length + ' 箇所';
  if(q && bounds.length){ map.fitBounds(bounds,{padding:[40,40],maxZoom:15}); }
}

function select(i, fly){
  current = i;
  const v = VENUES[i];
  if(fly) map.flyTo([v.lat,v.lon], Math.max(map.getZoom(),15), {duration:.6});
  v.marker.openPopup();
  [...listEl.children].forEach(el=>el.classList.remove('active'));
  const idx = order.filter(j=>{
    const w = VENUES[j];
    const q = qEl.value.trim().toLowerCase();
    if(q && (w.n+' '+w.ad+' '+w.ac).toLowerCase().indexOf(q)===-1) return false;
    if(multiEl.checked && w.ids.length===1) return false;
    return true;
  }).indexOf(i);
  if(idx>=0 && listEl.children[idx]){
    listEl.children[idx].classList.add('active');
    listEl.children[idx].scrollIntoView({block:'nearest'});
  }
}

qEl.addEventListener('input', render);
multiEl.addEventListener('change', render);
render();
map.fitBounds(VENUES.map(v=>[v.lat,v.lon]),{padding:[40,40]});
</script>
